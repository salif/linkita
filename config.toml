# The base URL of the site
base_url = "https://salif.github.io/linkita"

default_language = "bg"
author = "your_username"
generate_feeds = true

# Configuration of the Markdown rendering
[markdown]
highlight_code = true
extra_syntaxes_and_themes = []
highlight_theme = "monokai"

[languages.bg]
title = "Линкита"
description = "Линкита е многоезична, SEO оптимизирана, изчистена и елегантна блог тема за Zola."
# generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[languages.en]
title = "Linkita"
description = "A clean and elegant blog theme for Zola. Linkita is based on Kita and Hugo-Paper and is multilingual and SEO friendly."
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[languages.eo]
title = "Linkita"
description = "Pura kaj eleganta bloga temo por Zola. Linkita baziĝas sur Kita kaj Hugo-Paper kaj estas plurlingva kaj SEO-amika."
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[extra]
math = false
mermaid = false
comment = false
title_separator = " | "
menu = [
  { url = "$BASE_URL/projects/", name = "Projects", names_i18n = "common_projects" },
  { url = "$BASE_URL/archive/", name = "Archive", names_i18n = "common_archive" },
  { url = "$BASE_URL/tags/", name = "Tags", names_i18n = "common_tags" },
  { url = "$BASE_URL/about/", name = "About", names = { en = "About", bg = "Относно", eo = "Pri" } },
]

