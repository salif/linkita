base_url = "https://salif.github.io/linkita"

theme = "linkita"
# Default language is Bulgarian
default_language = "bg"
author = "sample_username"
minify_html = false

title = "Линкита"
description = "Линкита е многоезична, оптимизирана за търсачки, изчистена и елегантна блог тема за Зола."
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[languages.en]
title = "Linkita"
description = "A clean and elegant blog theme for Zola. Linkita is based on Kita and Hugo-Paper and is multilingual and SEO friendly."
