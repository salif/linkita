{% component _str(key: string, _msg: map) %}{%
  if _msg[key]?["value"] is string %}{{
    _msg[key]["value"] }}{%
  elif _msg[key]?["fallback"] is string %}{{
    _msg[key]["fallback"] }}{%
  else %}{{
    throw(message="No translation for key: " ~ key) }}{%
  endif
%}{% endcomponent %}
