{% component _str(key: string, _msg: map) %}{%
  if _msg[key]?["value"] %}{{
    _msg[key]["value"] | safe }}{%
  elif _msg[key]?["fallback"] %}{{
    _msg[key]["fallback"] | safe }}{%
  else %}{{
    throw(message="No translation for key: " ~ key) }}{%
  endif
%}{% endcomponent %}
