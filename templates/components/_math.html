{% component _math(use_cdn) -%}
  {%- if use_cdn %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"
    integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"
    integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js"
    integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
  {%- else %}
  <link rel="stylesheet" href="{{ <_link_static path=`katex/katex.min.css` /> }}" />
  <script defer src="{{ <_link_static path=`katex/katex.min.js` /> }}"></script>
  <script defer src="{{ <_link_static path=`katex/contrib/auto-render.min.js` /> }}"></script>
  {%- endif %}
  <script>document.addEventListener("DOMContentLoaded", window.zolaTheme.katex.init);</script>
{%- endcomponent %}
